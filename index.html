<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Luján 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f5f7;color:#222}
#online{position:fixed;inset:0;background:#fff;overflow:hidden}
#online iframe{border:0;display:block;background:#fff}
@media (max-width:700px){
  #online iframe{
    width:1000px;
    height:calc(100vh * 1000 / 360);
    transform-origin:0 0;
    transform:scale(calc(100vw / 1000));
  }
}
@media (min-width:701px){
  #online iframe{width:100%;height:100%}
}
#offline{display:none;min-height:100%;padding:12px}
.card{max-width:720px;margin:0 auto 10px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 8px #0001}
.head{text-align:center}
.head img{width:76px;height:76px;object-fit:cover;border-radius:16px}
h1{font-size:22px;margin:8px 0 3px} .muted{color:#687078;font-size:14px}
.badge{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#fff0d6;color:#8a4a00;font-weight:800}
label{display:block;font-weight:800;margin:10px 0 5px}
select,input,button{width:100%;font:inherit;border-radius:10px}
select,input{padding:12px;border:1px solid #aeb5bb;background:#fff;font-size:18px}
button{padding:13px;border:0;font-weight:800;margin-top:8px}
.dark{background:#303030;color:#fff} .green{background:#198754;color:#fff}
.gold{background:#8a5a00;color:#fff} .blue{background:#2864b7;color:#fff}
.gray{background:#e9edf0;color:#34434d;border:1px solid #9aa6ae}
#result,#pendingBox{margin-top:10px;line-height:1.45}
.person{padding:11px;background:#f5f9fd;border-radius:10px}
.notice{padding:10px;background:#fff1d6;border-radius:10px}
.ok{padding:10px;background:#eaf8ef;border-radius:10px;margin-top:8px}
.row{border-top:1px solid #ddd;padding:9px 0}
</style>
</head>
<body>
<section id="online"><iframe id="app" src="https://script.google.com/macros/s/AKfycbySujVV3q3W9nGlD9VGpTpycDxU_yYc1SiN22PCjZHLb8FAfksjcsRV39QXqYklo4JLKg/exec" title="Peregrinación a Luján 2026"></iframe></section>

<section id="offline">
 <div class="card head">
  <img src="./icon-192.png" alt="">
  <h1>52º Peregrinación a Luján 2026</h1>
  <div>Parroquia Sagrada Eucaristía</div>
  <div class="badge">OFFLINE</div>
  <div id="queueCount" class="muted" style="margin-top:8px"></div>
 </div>
 <div class="card">
  <label>Punto de control</label>
  <select id="point"><option>Parroquia</option><option>Morón</option><option>Merlo</option><option>La Reja</option><option>Rodríguez</option><option>Luján</option></select>
  <button class="gray" onclick="showPending()">VER PEREGRINOS PENDIENTES</button>
  <label>N.º de peregrino / DNI / nombre</label>
  <input id="query" inputmode="search" placeholder="Ej. 49">
  <button class="dark" onclick="searchOffline()">BUSCAR PEREGRINO</button>
  <div id="result"></div>
  <div id="actions" style="display:none">
   <button class="green" onclick="saveOffline('PRESENTE')">PRESENTE</button>
   <button class="gold" onclick="saveOffline('SE QUEDA')">SE QUEDA</button>
   <button class="blue" onclick="saveOffline('CONTINUA')">CONTINÚA</button>
  </div>
 </div>
 <div id="pendingCard" class="card" style="display:none"><div id="pendingBox"></div></div>
 <div class="card muted">Sin conexión se guardan PRESENTE, SE QUEDA y CONTINÚA con la hora real. Salud, micros, cancelaciones y regreso requieren Internet. Al recuperar señal, los registros pendientes se sincronizan automáticamente.</div>
</section>

<script>
const API="https://script.google.com/macros/s/AKfycbySujVV3q3W9nGlD9VGpTpycDxU_yYc1SiN22PCjZHLb8FAfksjcsRV39QXqYklo4JLKg/exec";
const KR='lujan24_roster', KQ='lujan24_queue';
let selected=null;
const read=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x??d}catch(e){return d}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function jsonp(params){
 return new Promise((resolve,reject)=>{
  const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const s=document.createElement('script'); let done=false;
  const clean=()=>{if(done)return;done=true;delete window[cb];s.remove();clearTimeout(t)};
  window[cb]=r=>{clean();resolve(r)};
  s.onerror=()=>{clean();reject(new Error('Sin conexión'))};
  s.src=API+'?'+new URLSearchParams({...params,callback:cb}).toString();
  document.head.appendChild(s);
  const t=setTimeout(()=>{clean();reject(new Error('Sin respuesta'))},25000);
 });
}
function queue(){return read(KQ,[])}
function paint(){
 const on=navigator.onLine;
 document.getElementById('online').style.display=on?'block':'none';
 document.getElementById('offline').style.display=on?'none':'block';
 document.getElementById('queueCount').textContent='Pendientes de sincronizar: '+queue().length;
}
async function refreshRoster(){
 if(!navigator.onLine)return;
 try{const r=await jsonp({api:'roster'});if(r&&r.ok&&Array.isArray(r.peregrinos))write(KR,r.peregrinos)}catch(e){}
}
async function refreshPending(){
 if(!navigator.onLine)return;
 for(const p of ['Parroquia','Morón','Merlo','La Reja','Rodríguez','Luján']){
  try{const r=await jsonp({api:'pending',punto:p});if(r&&r.ok)write('pending_'+norm(p),r)}catch(e){}
 }
}
async function sync(){
 if(!navigator.onLine)return;
 let a=queue();
 for(const item of [...a]){
  try{
   const r=await jsonp({api:'sync',payload:JSON.stringify(item)});
   if(r&&r.ok){a=a.filter(x=>x.id!==item.id);write(KQ,a)} else break;
  }catch(e){break}
 }
 paint();
}
window.searchOffline=()=>{
 const q=norm(document.getElementById('query').value), roster=read(KR,[]);
 selected=roster.find(x=>norm(x.numero)===q||norm(x.dni)===q) || roster.find(x=>norm(x.nombre).includes(q));
 const el=document.getElementById('result'), acts=document.getElementById('actions');
 if(!q||!selected){el.innerHTML='<div class="notice">No encontrado en la última nómina sincronizada.</div>';acts.style.display='none';return}
 el.innerHTML=`<div class="person"><b style="font-size:20px">${selected.nombre||'—'}</b><br>Nº ${selected.numero||'—'} · DNI ${selected.dni||'—'} · Edad ${selected.edad||'—'}<br>Teléfono: ${selected.telefono||'—'}<br>Cobertura: ${selected.cobertura||'—'} · Alimentación: ${selected.alimentacion||'—'}<br>Grupo sanguíneo: ${selected.grupo||'—'}<br>Salida: ${selected.salida||'—'} · Acompañante: ${selected.acompanante||'—'}</div>`;
 acts.style.display='block';
};
window.saveOffline=accion=>{
 if(!selected)return;
 const a=queue();
 const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());
 a.push({id,numero:selected.numero,punto:document.getElementById('point').value,accion,fechaCliente:new Date().toISOString()});
 write(KQ,a); paint();
 document.getElementById('result').insertAdjacentHTML('beforeend',`<div class="ok"><b>${accion}</b> guardado OFFLINE.</div>`);
};
window.showPending=()=>{
 const p=document.getElementById('point').value, d=read('pending_'+norm(p),null);
 const card=document.getElementById('pendingCard'), box=document.getElementById('pendingBox');card.style.display='block';
 if(!d){box.innerHTML='<b>PENDIENTES — '+p.toUpperCase()+'</b><div class="notice" style="margin-top:8px">Todavía no hay una lista guardada para esta parada.</div>';return}
 const arr=d.pendientes||d.lista||[];
 let h='<b>PENDIENTES — '+p.toUpperCase()+'</b><div class="muted">Último estado descargado con conexión.</div>';
 if(d.esperados!==undefined)h+=`<p><b>Esperados:</b> ${d.esperados} · <b>Presentes:</b> ${d.presentes??'—'} · <b>Pendientes:</b> ${d.pendientesCantidad??arr.length}</p>`;
 if(!arr.length)h+='<p>No hay peregrinos pendientes.</p>';
 for(const x of arr)h+=`<div class="row"><b>${x.numero||''} · ${x.nombre||''}</b><br>DNI: ${x.dni||'—'} · Tel: ${x.telefono||'—'}<br>Salida: ${x.salida||'—'}</div>`;
 box.innerHTML=h;
};
async function onlineWork(){await sync();await Promise.all([refreshRoster(),refreshPending()]);paint()}
window.addEventListener('online',()=>{paint();onlineWork()});
window.addEventListener('offline',paint);
document.addEventListener('DOMContentLoaded',()=>{paint();if(navigator.onLine)onlineWork()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
